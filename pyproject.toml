[project]
name = "chavales-legales"
version = "0.1.0"
description = "Extracción de datos legales (juicios/sentencias sobre menores y tecnología) y generación automática de juegos didácticos para enseñar los derechos digitales de los menores bajo la ley española."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
